name: Auto Release

# A push to main whose commit subject starts with "v" (or a manual run) publishes
# the version written in version.txt as the tag vX.Y.Z with a signed APK attached.
# The in-app updater reads /releases/latest and compares that tag with its own
# versionCode, so the asset name only has to end in .apk.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Signed APK release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version.txt
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.txt must contain X.Y.Z, found '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION as tag v$VERSION"

      - name: Require the release keystore
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            echo "::error::secret RELEASE_KEYSTORE_BASE64 is not set: release APKs must be signed with the release keystore"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Il base64 puo' arrivare con a capo, spazi o CRLF (e' copiato da Windows):
          # si tolgono prima di decodificare, altrimenti il keystore esce corrotto.
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | sed 's/_/+/g; s/-/\//g' \
            | awk '{ l = length($0) % 4; if (l == 2) print $0 "=="; else if (l == 3) print $0 "="; else print $0 }' \
            | base64 --decode > release.keystore
          if [ ! -s release.keystore ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 non ha prodotto un file: ricontrolla il secret"
            exit 1
          fi
          # La password e' fissa per scelta del titolare: il keystore di rilascio e'
          # stato creato con storePassword e keyPassword "android", alias pdf-to-usb.
          {
            echo "storeFile=release.keystore"
            echo "storePassword=android"
            echo "keyAlias=pdf-to-usb"
            echo "keyPassword=android"
          } > keystore.properties
          # Fermati qui, con un messaggio leggibile, se il file restaurato non si apre.
          if ! keytool -list -keystore release.keystore -storepass android -alias pdf-to-usb > /dev/null 2>&1; then
            echo "::error::release.keystore non si apre con storePassword 'android' e alias 'pdf-to-usb': il secret RELEASE_KEYSTORE_BASE64 non contiene il keystore giusto o e' troncato"
            exit 1
          fi

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/pdf-to-usb-${{ steps.version.outputs.version }}.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            "dist/pdf-to-usb-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pdf To Usb ${{ steps.version.outputs.version }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: false
          generate_release_notes: true
          files: dist/pdf-to-usb-${{ steps.version.outputs.version }}.apk
          body: |
            Automated release built from `version.txt` (${{ steps.version.outputs.version }}).

            Android asks once for "install unknown apps" and then shows its install
            confirmation: those dialogs belong to the OS and cannot be skipped.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

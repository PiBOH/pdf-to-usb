<svg id="matrixPdfIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-full h-full"><defs><!-- Background Dark Gradient --><linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#111827"/><stop offset="60%" stop-color="#051c14"/><stop offset="100%" stop-color="#020c08"/></linearGradient><!-- PDF Red Header Gradient --><linearGradient id="pdfHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#EF4444"/><stop offset="100%" stop-color="#DC2626"/></linearGradient><!-- Document Body Gradient (Paper fading to Dark Matrix) --><linearGradient id="docBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.98"/><stop offset="40%" stop-color="#E2E8F0" stop-opacity="0.85"/><stop offset="70%" stop-color="#064E3B" stop-opacity="0.4"/><stop offset="100%" stop-color="#022C22" stop-opacity="0.0"/></linearGradient><!-- Matrix Rain Glow Filter --><filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><!-- PDF Badge Shadow --><filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/></filter></defs><!-- App Icon Background Frame --><rect width="512" height="512" rx="112" fill="url(#bgGrad)"/><!-- Subtle Grid Background lines --><path d="M0 64H512 M0 128H512 M0 192H512 M0 256H512 M0 320H512 M0 384H512 M0 448H512" stroke="#10B981" stroke-opacity="0.05" stroke-width="1"/><path d="M64 0V512 M128 0V512 M192 0V512 M256 0V512 M320 0V512 M384 0V512 M448 0V512" stroke="#10B981" stroke-opacity="0.05" stroke-width="1"/><!-- MAIN DOCUMENT SHAPE (PDF Paper base) --><!-- Top-right folded corner path --><path d="M 140 80                         H 310                         L 372 142                         V 420                        